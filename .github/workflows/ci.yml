name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No dependencies to install: the site vendors what it needs and the
      # tests run on node:test.
      - name: Verify asset references resolve
        run: node scripts/check-assets.mjs

      - name: Unit tests
        run: npm test
